spring:
  application:
    name: ativacao
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ativacao}
    username: ${DB_USER:ativacao}
    password: ${DB_PASSWORD:ativacao_local}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 1
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
        max.block.ms: 5000
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  shutdown: graceful
logging:
  structured:
    format:
      console: logstash
ativacao:
  documentacao:
    token-url: ${SWAGGER_OAUTH_TOKEN_URL:}
  mensageria:
    habilitado: ${KAFKA_ENABLED:true}
    topico: ${KAFKA_TOPIC:ativacao.local.solicitacoes.v1}
    grupo: ${KAFKA_GROUP:ativacao-provedor-v1}
    particoes: ${KAFKA_PARTITIONS:3}
    replicas: ${KAFKA_REPLICATION_FACTOR:1}
  seguranca:
    emissor: ${AUTH_ISSUER:https://auth.exemplo.com}
    audiencia: ${AUTH_AUDIENCE:ativacao-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:}
    chave-hmac: ${AUTH_HMAC_KEY:}
  provedor:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    api-key: ${PROVIDER_API_KEY:}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:1s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:3s}
  processamento:
    intervalo: 1s
    tamanho-lote: 20
    maximo-tentativas: 5
    backoff-base: 2s
    backoff-teto: 5m
    prazo-processamento: 60s
    intervalo-reconciliacao: 30s
resilience4j:
  circuitbreaker:
    instances:
      provedor:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: false
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 2s

springdoc:
  paths-to-match: /api/v1/requests/**
  swagger-ui:
    persist-authorization: false
    oauth:
      scope-separator: " "
    supported-submit-methods: [get, post]
