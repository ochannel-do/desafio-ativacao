spring:
  application:
    name: ativacao
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ativacao}
    username: ${DB_USER:ativacao}
    password: ${DB_PASSWORD:ativacao_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  shutdown: graceful
logging:
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 2s
