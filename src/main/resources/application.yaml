spring:
  application:
    name: ativacao
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ativacao}
    username: ${DB_USER:ativacao}
    password: ${DB_PASSWORD:ativacao_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  shutdown: graceful
logging:
  structured:
    format:
      console: logstash
ativacao:
  provedor:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    api-key: ${PROVIDER_API_KEY:}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:1s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:3s}
  processamento:
    intervalo: 1s
    tamanho-lote: 20
    maximo-tentativas: 5
    backoff-base: 2s
    backoff-teto: 5m
    prazo-processamento: 60s
    intervalo-reconciliacao: 30s
resilience4j:
  circuitbreaker:
    instances:
      provedor:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 2s
