apiVersion: v1
kind: ConfigMap
metadata:
  name: provider-mock-mappings
data:
  activate-success.json: "{\n  \"request\": { \"method\": \"POST\", \"urlPath\": \"\
    /provider/v1/activate\" },\n  \"response\": {\n    \"status\": 200,\n    \"headers\"\
    : { \"Content-Type\": \"application/json\" },\n    \"jsonBody\": { \"status\"\
    : \"ACTIVATED\" },\n    \"fixedDelayMilliseconds\": 150\n  }\n}\n"
  activate-rejected.json: "{\n  \"priority\": 1,\n  \"request\": {\n    \"method\"\
    : \"POST\",\n    \"urlPath\": \"/provider/v1/activate\",\n    \"bodyPatterns\"\
    : [{ \"matchesJsonPath\": \"$[?(@.productCode =~ /INVALID-.*/)]\" }]\n  },\n \
    \ \"response\": { \"status\": 400, \"jsonBody\": { \"error\": \"PRODUCT_NOT_ALLOWED\"\
    \ }, \"headers\": { \"Content-Type\": \"application/json\" } }\n}\n"
  activate-slow.json: "{\n  \"priority\": 1,\n  \"request\": {\n    \"method\": \"\
    POST\",\n    \"urlPath\": \"/provider/v1/activate\",\n    \"bodyPatterns\": [{\
    \ \"matchesJsonPath\": \"$[?(@.productCode =~ /SLOW-.*/)]\" }]\n  },\n  \"response\"\
    : { \"status\": 200, \"fixedDelayMilliseconds\": 5000 }\n}\n"
  activate-unavailable.json: "{\n  \"priority\": 1,\n  \"request\": {\n    \"method\"\
    : \"POST\",\n    \"urlPath\": \"/provider/v1/activate\",\n    \"bodyPatterns\"\
    : [{ \"matchesJsonPath\": \"$[?(@.productCode =~ /BUSY-.*/)]\" }]\n  },\n  \"\
    response\": { \"status\": 503, \"headers\": { \"Retry-After\": \"10\" } }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider-mock
  template:
    metadata:
      labels:
        app: provider-mock
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: wiremock
        image: wiremock/wiremock:3.13.1
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        readinessProbe:
          httpGet:
            path: /__admin/mappings
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /__admin/mappings
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        env:
        - name: JAVA_OPTS
          value: -XX:MaxRAMPercentage=65
        volumeMounts:
        - name: mappings
          mountPath: /home/wiremock/mappings
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: mappings
        configMap:
          name: provider-mock-mappings
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: provider-mock
spec:
  selector:
    app: provider-mock
  ports:
  - name: http
    port: 8080
    targetPort: http
