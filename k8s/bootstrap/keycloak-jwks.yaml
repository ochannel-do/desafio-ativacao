apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ativacao-keycloak-jwks
  namespace: ativacao-hml
spec:
  podSelector:
    matchLabels:
      app: ativacao
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keycloak
      podSelector:
        matchLabels:
          app: keycloak
    ports:
    - port: 8080
      protocol: TCP
