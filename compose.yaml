services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ativacao
      POSTGRES_USER: ativacao
      POSTGRES_PASSWORD: ativacao_local
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ativacao"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  provider-mock:
    image: wiremock/wiremock:3.13.1
    ports: ["8089:8080"]
    volumes: ["./wiremock:/home/wiremock:ro"]
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports: ["16686:16686", "4318:4318"]
  app:
    profiles: ["app"]
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/ativacao
      PROVIDER_BASE_URL: http://provider-mock:8080
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      provider-mock:
        condition: service_started
volumes:
  postgres_data:
