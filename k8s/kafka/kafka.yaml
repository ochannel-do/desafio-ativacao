apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
data:
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_NODE_ID: '1'
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka.messaging.svc.cluster.local:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0.kafka-headless.messaging.svc.cluster.local:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_LOG_RETENTION_HOURS: '24'
  KAFKA_LOG_RETENTION_BYTES: '268435456'
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kafka
        image: apache/kafka:4.1.1
        ports:
        - name: broker
          containerPort: 9092
        - name: controller
          containerPort: 9093
        envFrom:
        - configMapRef:
            name: kafka-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: 1500m
            memory: 1536Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /opt/kafka/config
        - name: logs
          mountPath: /opt/kafka/logs
        startupProbe:
          tcpSocket:
            port: broker
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          tcpSocket:
            port: broker
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: broker
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: config
        emptyDir:
          sizeLimit: 128Mi
      - name: logs
        emptyDir:
          sizeLimit: 128Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
  - name: broker
    port: 9092
    targetPort: broker
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
  - name: broker
    port: 9092
    targetPort: broker
  - name: controller
    port: 9093
    targetPort: controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ativacao-hml
      podSelector:
        matchLabels:
          app: ativacao
    ports:
    - port: 9092
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - port: 9092
      protocol: TCP
    - port: 9093
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - port: 9092
      protocol: TCP
    - port: 9093
      protocol: TCP
