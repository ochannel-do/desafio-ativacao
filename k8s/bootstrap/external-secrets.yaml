apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-reader
  namespace: ativacao-hml
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: ativacao-hml
spec:
  provider:
    vault:
      server: https://openbao.openbao-ativacao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ativacao-hml
          serviceAccountRef:
            name: openbao-reader
            audiences:
            - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ativacao-config
  namespace: ativacao-hml
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: ativacao-config-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: ativacao/hml/config
